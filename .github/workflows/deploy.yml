name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # アプリ1 (app-kusanuki) のビルド
      - name: Build app-kusanuki
        run: |
          cd app-kusanuki
          npm ci
          npm run build

      # アプリ2 (app-nazori) のビルド
      - name: Build app-nazori
        run: |
          cd app-nazori
          npm ci
          npm run build

      # アプリ3 (app-tsunagu) のビルド
      - name: Build app-tsunagu
        run: |
          cd app-tsunagu
          npm ci
          npm run build

      # アプリ4 (app-dance) のビルド
      - name: Build app-dance
        run: |
          cd app-dance
          npm ci
          npm run build

      # ディレクトリ構造を整えて公開フォルダ (dist_github) を作成
      - name: Prepare public directory
        run: |
          mkdir dist_github
          cp -r app-kusanuki/dist dist_github/app-kusanuki
          cp -r app-nazori/dist dist_github/app-nazori
          cp -r app-tsunagu/dist dist_github/app-tsunagu
          cp -r app-dance/dist dist_github/app-dance
          cp index.html dist_github/index.html
          cp manifest.json dist_github/manifest.json
          cp sw.js dist_github/sw.js
          cp favicon.svg dist_github/favicon.svg







      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_github'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
